[project]
name = "mba-ia-desafio-criacao-agente"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Antonio Canhota", email = "1024835+antoniocanhota@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-adk===2.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
mba-ia-desafio-criacao-agente = "mba_ia_desafio_criacao_agente:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.fastapi]
entrypoint = "api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--tb=short", "-ra"]
markers = [
    "llm: chama o Gemini real (precisa de GOOGLE_API_KEY; consome cota)",
]
